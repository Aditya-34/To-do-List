<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-danger,
        .card-footer {
            background: linear-gradient(45deg, black, rgb(163, 163, 163)) !important;
        }

            {
            width: 50px !important;
            height: 20px !important;
        }
    </style>
</head>

<body class="bg-light">

    <section class="container mt-4">
        <div class="row">
            <div class="col-6 m-auto">
                <div class="card">
                    <div class="card-header bg-danger text-white text-center">
                        <h2>Todo List</h2>
                    </div>
                    <div class="card-body">
                        <form id="task-form">
                            <div>
                                <input type="text" placeholder="Enter Item" class="form-control" id="task-ele">
                            </div>
                            <div class="mt-2">
                                <input type="submit" class="btn btn-dark">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="container mt-4">
        <div class="row">
            <div class="col-6 m-auto">
                <div class="card">
                    <div class="card-body">
                        <ol class="list-group" id="display-items">

                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- JS -->
    <script src="TODO.JS"> </script>

</body>

</html>
